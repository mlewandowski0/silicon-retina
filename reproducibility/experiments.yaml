# Paper experiment -> inputs, generation settings, run configs and numerical results.
# Paths are relative to the repository root. "as_run" configs are the files the recorded runs were
# launched with (W&B metadata / logs); status flags what the records do NOT establish.
# Evidence and open questions: reproducibility/audit.md.

datasets:
  dhf1k_saliency:
    source: DHF1K annotated clips 001-700 (see reproducibility/sources.md)
    manifest: reproducibility/manifests/dhf1k_saliency_split.csv        # 541 clips, 431 train / 110 val
    exclusions: reproducibility/manifests/dhf1k_saliency_exclusions.csv # 159 clips with reasons
    resolution: [180, 320]          # source 360x640, x0.5 INTER_AREA
    source_fps: 30
    upsampled_inputs:
      fixed_200fps: video_upsampled_fps_eq_200.mp4         # t = k/200 s
      optical_flow: video_upsampled_using_optical_flow.mp4 # adaptive bisection, <= 16 frames per pair
    target: annotation maps -> outputs.npz (N x 180 x 320 x 3 uint8)
  ecoco_intensity:
    source: ecoco_depthmaps_test.zip, frames only (see reproducibility/sources.md)
    manifest: reproducibility/manifests/ecoco_intensity_split.csv       # 948 train / 51 validation
    resolution: [180, 240]
    source_fps: 27                  # assumed by the pipeline; timestamps.txt gives ~27.6
    upsampled_inputs: {fixed_200fps: video_upsampled_fps_eq_200.mp4, optical_flow: video_upsampled_using_optical_flow.mp4}
    target: source frames (raw_images.npz)

generation:
  command: python -m reproducibility.regenerate --task {saliency|intensity} --subset {smoke|full} --source-root <src> --out <dir>
  variants:   # defined in reproducibility/regenerate.py TASKS
    saliency:
      retina_ff200: {config: src/neural_network/configs/saliency/retina/FIREnetwork_retina_saliency_p2_eq_1.0_seq=30_gk7.json, input: fixed_200fps}
      dvs_of:       {config: src/neural_network/configs/saliency/events/FIREnetwork_event_saliency_seq=50.json, input: optical_flow}
      retina_of:    {config: same as retina_ff200 with use_upsampled_from_OF=true, input: optical_flow}
    intensity:
      dvs_of:        {config: src/neural_network/configs/FIREnetwork.json, input: optical_flow}   # log input, 5 bins (as trained)
      dvs_of_linear: {config: src/neural_network/configs/FIREnetwork.json, overrides: {log_input: false}, input: optical_flow}
      retina_ff200: {config: src/neural_network/configs/FIREnetwork_event_bins_eq2.json, input: fixed_200fps}
  other_configs: >-
    Any training config can be regenerated by its event settings with
    --variants <name> --set <name>.<key>=<value>; e.g. the retina ablations differ only in
    silicon_retina_config, the DVS sweep only in event_representation_params.contrast_threshold_*.

experiments:
  - id: intensity_dvs_vs_retina
    figure: intensity_{training,validation}_loss.png, intensity_convergence_curves.png
    dataset: ecoco_intensity
    entry_points:
      dvs: src.neural_network.experiment.reconstruct_intensity_using_FIREnetwork_events
      retina: src.neural_network.experiment.reconstruct_intensity_using_FIREnetwork_silicon_retina_v2
    as_run:
      dvs: {config: src/neural_network/configs/FIREnetwork.json, run: FIREnetwork_20250901_173249 (W&B yfoy3nt3),
            note: "config updated to the events the run trained on (num_bins 5, log input); the run itself logged log_input false but read log-input caches"}
      retina: {config: unknown, runs: unknown}
    events: {dvs: optical_flow video, ESIM, thresholds 0.2, num_bins 5, log input (as cached), retina: fixed_200fps video}
    results: [paper-figures/analysis/intensity-train.csv, paper-figures/analysis/intensity-val.csv]
    notebook: paper-figures/analysis_intensity.ipynb
    regenerate_variants: [dvs_of, retina_ff200]
    status: retina runs and their retina parameters not identified from local records

  - id: saliency_main_comparison
    figure: saliency_{training,validation}_loss.png
    dataset: dhf1k_saliency
    entry_points:
      retina: src.neural_network.experiment.saliency_using_FIREnetwork_silicon_retina
      dvs: src.neural_network.experiment.saliency_using_FIREnetwork_events_v2
    as_run:
      retina: {config: src/neural_network/configs/saliency/retina/FIREnetwork_retina_saliency_p2_eq_1.0_seq=30_gk7.json,
               run: FIRE_saliency_seq=50_gk5_20251201_014614 (W&B h1l2i6zo)}
      dvs: {config: "unknown; run FIREnetwork_DVS_seq=50 has no local record (event settings of every DVS saliency config: ESIM, log, 0.2/0.2)"}
    inputs: {retina: fixed_200fps, dvs: optical_flow}   # by design (paper Sec. 4.3): each sensor model gets the upsampling suited to it
    results: [paper-figures/analysis/retina_train_saliency.csv, paper-figures/analysis/retina_val_saliency.csv]
    notebook: paper-figures/analysis_saliency.ipynb (cells 5-13)
    regenerate_variants: [retina_ff200, dvs_of]
    status: >-
      retina run (2025-12-01) used the retina kernel before commit 396ebf1 (clamping correction), so
      released code regenerates corrected-model events (build esim_torch from 396ebf1^ for that run);
      DVS run record missing; which OF video generation (v1/v2) the DVS run read is not recorded

  - id: saliency_feedback_ablation
    figure: feedback_comparison_detailed.png, feedback_comparison_detailed_3.png
    as_run:
      configs: [christmas_run/best_no_feedback.json, christmas_run/best_quad_fb.json, christmas_run/best_quad_abs_fb.json]
      runs: [Fire_saliency_no_fb (mk4yzsv1), Fire_saliency_quad_fb (gy2senvi), Fire_saliency_abs_fb (k4ylh8w4)]
    input: fixed_200fps
    results: [paper-figures/analysis/feedback_train_loss.csv, paper-figures/analysis/feedback_val_loss.csv, values typed into notebook cell 16]
    status: "labels swapped w.r.t. q_feedback_mode (0=ABS, 1=QUADRATIC); identical recorded occupancy for both feedback runs"

  - id: saliency_hpf_ablation
    figure: hpf_ablation_bars.png, hpf_ablation_heatmaps.png
    as_run: {configs: "christmas_run/best_t{1,2,3,4}{,a}.json"}
    input: fixed_200fps
    results: [values typed into paper-figures/analysis_saliency.ipynb cell 26]
    status: no CSV export; aggregation of the typed values undocumented; t2-t4 final val loss NaN in records

  - id: saliency_kernel_ablation
    figure: spatial_kernel_ablation_final.png
    as_run: {configs: "saliency/retina/kernel_sweep/best_k_eq_{1,3,5,7,9}_{gauss,uniform}.json"}
    input: fixed_200fps
    results: [paper-figures/analysis/kernel_sweep_train_loss.csv, paper-figures/analysis/kernel_sweep_val_loss.csv]

  - id: saliency_sparsity_sweep
    figure: sparsity_performance_sweep{,_robust,_annotated}.png
    as_run:
      retina: {configs: "christmas_run/best_b1..best_b5.json (+ p2 1.35/1.4/1.5 from an edited b5)", runs: not found locally}
      dvs: {configs: "saliency/events/thr_sweep/*.json; thr_500..thr_1400 only in the author's local checkout"}
    inputs: {retina: fixed_200fps, dvs: optical_flow (v2)}
    results: [paper-figures/analysis/bandwidth_train.csv, paper-figures/analysis/bandwidth_val.csv,
              paper-figures/analysis/dvs_sweep_train.csv, paper-figures/analysis/dvs_sweep_val.csv, occupancies typed into cells 22-23]
    status: retina sweep exports show 12 steps/epoch, i.e. a different batch size or data than the committed configs

  - id: saliency_upsampling_comparison
    figure: upsampling_convergence_curves_fixed.png, upsampling_comparison_boxplot_{train,val}.png
    as_run:
      dvs_optical_flow: {configs: "saliency/events/FIREnetwork_event_saliency{,_thr_225,_thr_25,_thr_275,_thr_30}.json", note: mixed thresholds}
      dvs_fixed_200fps: {configs: saliency/events/FIREnetwork_event_saliency.json, runs: [FIREnetwork_20260211_131459, FIREnetwork_20260211_200608, FIREnetwork_20260212_025427],
                         code: "uncommitted (git stash on 6999aaa): 200 FPS frames stamped with the optical-flow timestamps and binned by the optical-flow pairs"}
      retina_fixed_200fps: {note: reuses kernel / feedback runs}
    results: [paper-figures/analysis/comparison_train_loss.csv, paper-figures/analysis/comparison_val_loss.csv,
              "paper-figures/{train,val}_stats_*.csv"]
    regenerate_variants: [retina_ff200, retina_of, dvs_of, dvs_ff200]
    corrected_rerun: {config: src/neural_network/configs/saliency/events/FIREnetwork_event_saliency_fixed_200fps.json,
                      script: scripts/runpod/dvs_fixed_200fps.sh, note: "DVS on the retina's 200 FPS videos with their own timestamps (dvs_input_video: fixed_200fps)"}
    status: >-
      the "DVS (Fixed 200 FPS)" curve of Fig. 12 is invalid: its events carry the wrong timestamps
      (median error 2.2 s per clip, ~4.6 s at clip end; ~13% of each clip without events), so its
      higher loss does not show that fixed-rate upsampling handicaps the DVS. The optical-flow DVS
      group is 7 runs with thresholds 0.2 (x3), 0.225, 0.25, 0.275, 0.3, not 7 seeds; training is unseeded.

  - id: retina_parameter_search
    as_run: {entry_point: src.neural_network.experiment.saliency_BO_sweep, config: src/neural_network/configs/saliency_retina_BO_base.json}
    results: [results/hyperparameter_search/retina_sweep.db, results/hyperparameter_search/best_optuna_params.json]
    status: Optuna sampler unseeded
